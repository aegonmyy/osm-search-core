[package]
name = "osm-search-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "osm_search_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
flate2 = "1"
bytes = "1"
md-5 = { version = "0.10", features = ["asm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
